<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 308" width="880" height="308" role="img" aria-label="This account&#x27;s upstream contributions are run by Software Factory. Snapshot 2026-11-21: 101 merged pull requests in 19 projects since 2026-10-24. Of 124 opened at least 14 days ago, 96 merged, 68 of them without rework. Steps: scout, select, build, verify, gate, ship.">
<title>This account&#x27;s upstream contributions are run by Software Factory. Snapshot 2026-11-21: 101 merged pull requests in 19 projects since 2026-10-24. Of 124 opened at least 14 days ago, 96 merged, 68 of them without rework. Steps: scout, select, build, verify, gate, ship.</title>
<style>.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.row{animation:row 12s linear infinite;opacity:.42}.mark{animation:mark 12s linear infinite;opacity:0}@keyframes row{0%,16.67%{opacity:1}18.67%,100%{opacity:.42}}@keyframes mark{0%,16.67%{opacity:1}18.67%,100%{opacity:0}}.belt{animation:belt .7s linear infinite}@keyframes belt{to{stroke-dashoffset:-16}}.blink{animation:blink 1.2s steps(2,start) infinite}@keyframes blink{to{visibility:hidden}}@media (prefers-reduced-motion: reduce){.row,.mark,.belt,.blink{animation:none}.row{opacity:1}.mark{opacity:1}.moving{display:none}}</style>
<defs><pattern id="g-lightw" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#f3f5f7" stroke-width="1"/></pattern></defs>
<rect x="0.5" y="0.5" width="879" height="307" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<rect x="1" y="1" width="878" height="306" rx="12" fill="url(#g-lightw)"/>
<circle cx="33" cy="33" r="5" fill="#d1510b"/>
<text class="mono" x="46" y="38" font-size="13" font-weight="700" letter-spacing="1.4" fill="#1f2328">RUN BY SOFTWARE FACTORY</text>
<text class="mono" x="852" y="38" font-size="11.5" letter-spacing="1.2" fill="#59636e" text-anchor="end">SNAPSHOT 2026-11-21</text>
<text class="sans" x="28" y="62" font-size="13" fill="#59636e">An agent pipeline opens this account's upstream pull requests, issues and replies. I design it and set its rules.</text>
<text class="mono" x="28" y="124" font-size="40" font-weight="700" letter-spacing="-1" fill="#0969da">101</text>
<text class="sans" x="28" y="146" font-size="13" font-weight="600" fill="#1f2328">merged pull requests</text>
<text class="sans" x="28" y="163" font-size="11.5" fill="#59636e">in 19 projects since 2026-10-24</text>
<text class="mono" x="303" y="124" font-size="40" font-weight="700" letter-spacing="-1" fill="#1f2328">77%</text>
<text class="sans" x="303" y="146" font-size="13" font-weight="600" fill="#1f2328">merge rate</text>
<text class="sans" x="303" y="163" font-size="11.5" fill="#59636e">96 of 124 opened 14+ days ago</text>
<text class="mono" x="577" y="124" font-size="40" font-weight="700" letter-spacing="-1" fill="#1f2328">72%</text>
<text class="sans" x="577" y="146" font-size="13" font-weight="600" fill="#1f2328">merged without rework</text>
<text class="sans" x="577" y="163" font-size="11.5" fill="#59636e">68 of 95 merges</text>
<path d="M28 174H852" stroke="#d0d7de" stroke-width="1"/>
<text class="mono mark" x="28" y="198" font-size="12" font-weight="700" fill="#d1510b" style="animation-delay:0s">&gt;</text>
<g class="row" style="animation-delay:0s"><text class="mono" x="42" y="198" font-size="12" font-weight="700" letter-spacing=".6" fill="#1f2328">scout</text><text class="sans" x="98" y="198" font-size="12" fill="#1f2328">reads a problem someone reported</text></g>
<text class="mono mark" x="28" y="219" font-size="12" font-weight="700" fill="#d1510b" style="animation-delay:2s">&gt;</text>
<g class="row" style="animation-delay:2s"><text class="mono" x="42" y="219" font-size="12" font-weight="700" letter-spacing=".6" fill="#1f2328">select</text><text class="sans" x="98" y="219" font-size="12" fill="#1f2328">asks who hits it and whether the project wants a fix</text></g>
<text class="mono mark" x="28" y="240" font-size="12" font-weight="700" fill="#d1510b" style="animation-delay:4s">&gt;</text>
<g class="row" style="animation-delay:4s"><text class="mono" x="42" y="240" font-size="12" font-weight="700" letter-spacing=".6" fill="#1f2328">build</text><text class="sans" x="98" y="240" font-size="12" fill="#1f2328">writes the fix and a test that fails without it</text></g>
<text class="mono mark" x="440" y="198" font-size="12" font-weight="700" fill="#d1510b" style="animation-delay:6s">&gt;</text>
<g class="row" style="animation-delay:6s"><text class="mono" x="454" y="198" font-size="12" font-weight="700" letter-spacing=".6" fill="#1f2328">verify</text><text class="sans" x="510" y="198" font-size="12" fill="#1f2328">a second agent tries to break it</text></g>
<text class="mono mark" x="440" y="219" font-size="12" font-weight="700" fill="#d1510b" style="animation-delay:8s">&gt;</text>
<g class="row" style="animation-delay:8s"><text class="mono" x="454" y="219" font-size="12" font-weight="700" letter-spacing=".6" fill="#1f2328">gate</text><text class="sans" x="510" y="219" font-size="12" fill="#1f2328">reruns the proof, scans, binds the exact commit</text></g>
<text class="mono mark" x="440" y="240" font-size="12" font-weight="700" fill="#d1510b" style="animation-delay:10s">&gt;</text>
<g class="row" style="animation-delay:10s"><text class="mono" x="454" y="240" font-size="12" font-weight="700" letter-spacing=".6" fill="#1f2328">ship</text><text class="sans" x="510" y="240" font-size="12" fill="#1f2328">opens the pull request and says it is automated</text></g>
