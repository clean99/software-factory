<path d="M712 215.0H924" stroke="#6e7681" stroke-width="2" opacity=".55"/>
<text class="mono" x="718" y="240.0" font-size="12" font-weight="700" letter-spacing="1" fill="#e6edf3">REFUSED</text>
<text class="sans" x="718" y="258.0" font-size="11" fill="#8b949e">a stale binding, a rerun that exits</text>
<text class="sans" x="718" y="273.0" font-size="11" fill="#8b949e">differently, or a scan finding</text>
<circle cx="916" cy="235.0" r="3.5" fill="#6e7681"/>
<text class="mono" x="600" y="66" font-size="12" font-weight="700" letter-spacing="1.4" fill="#e6edf3" text-anchor="middle">RELEASE GATE</text>
