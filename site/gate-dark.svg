<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="The release gate on the structured path. Independent review and coordinator review are each bound to the head commit and the pull-request text. The approval record is bound to the exact head and the exact prepared text. The gate compares every binding with what is about to be pushed. When all match and the leak and privacy scans pass, the push and pull request go out. A stale binding, a rerun that exits differently or a scan finding refuses the push. A receipt is the CLI's signed record of one proof command.">
<title>The release gate on the structured path. Independent review and coordinator review are each bound to the head commit and the pull-request text. The approval record is bound to the exact head and the exact prepared text. The gate compares every binding with what is about to be pushed. When all match and the leak and privacy scans pass, the push and pull request go out. A stale binding, a rerun that exits differently or a scan finding refuses the push. A receipt is the CLI's signed record of one proof command.</title>
