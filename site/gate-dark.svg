<text class="sans" x="600" y="343" font-size="11" fill="#8b949e" text-anchor="middle">every binding is compared with what is about to be pushed</text>
<path d="M28 362H932" stroke="#30363d" stroke-width="1"/>
<text class="mono" x="28" y="384" font-size="12" fill="#e6edf3"><tspan font-weight="700">receipt</tspan><tspan fill="#8b949e"> = the CLI's signed record of one proof command: argv · exit status · output hash · commits</tspan></text>
<text class="sans" x="28" y="404" font-size="11" fill="#8b949e">The gate checks bindings and scans. It does not judge whether a reviewer was right.</text>
