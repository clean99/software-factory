<text class="mono" x="42" y="108.0" font-size="12" font-weight="700" letter-spacing="1" fill="#e6edf3">INDEPENDENT REVIEW</text>
<text class="sans" x="42" y="126.0" font-size="11" fill="#8b949e">one answer per risk class,</text>
<text class="sans" x="42" y="141.0" font-size="11" fill="#8b949e">each citing a receipt</text>
<rect x="28" y="165.0" width="250" height="70" rx="8" fill="#161b22" fill-opacity=".94" stroke="#30363d" stroke-width="1.2"/>
<path d="M36 165.0H270" stroke="#ff8a3d" stroke-width="2" opacity=".55"/>
<text class="mono" x="42" y="190.0" font-size="12" font-weight="700" letter-spacing="1" fill="#e6edf3">COORDINATOR REVIEW</text>
<text class="sans" x="42" y="208.0" font-size="11" fill="#8b949e">reruns the proofs on this head,</text>
<text class="sans" x="42" y="223.0" font-size="11" fill="#8b949e">adds its own counterexample</text>
<rect x="28" y="247.0" width="250" height="70" rx="8" fill="#161b22" fill-opacity=".94" stroke="#30363d" stroke-width="1.2"/>
<path d="M36 247.0H270" stroke="#ff8a3d" stroke-width="2" opacity=".55"/>
<text class="mono" x="42" y="272.0" font-size="12" font-weight="700" letter-spacing="1" fill="#e6edf3">APPROVAL RECORD</text>
<text class="sans" x="42" y="290.0" font-size="11" fill="#8b949e">the owner's standing approval,</text>
<text class="sans" x="42" y="305.0" font-size="11" fill="#8b949e">recorded for this item</text>
<rect x="704" y="115.0" width="228" height="70" rx="8" fill="#161b22" fill-opacity=".94" stroke="#30363d" stroke-width="1.2"/>
<path d="M712 115.0H924" stroke="#58a6ff" stroke-width="2" opacity=".55"/>
<text class="mono" x="718" y="140.0" font-size="12" font-weight="700" letter-spacing="1" fill="#e6edf3">PUSH + PULL REQUEST</text>
<text class="sans" x="718" y="158.0" font-size="11" fill="#8b949e">every binding matches;</text>
<text class="sans" x="718" y="173.0" font-size="11" fill="#8b949e">leak and privacy scans pass</text>
<circle cx="916" cy="135.0" r="3.5" fill="#58a6ff"/>
