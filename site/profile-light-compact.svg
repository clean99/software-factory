<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 466" width="440" height="466" role="img" aria-label="This account&#x27;s upstream contributions are run by Software Factory. Snapshot 2026-11-26: 107 merged pull requests in 22 projects since 2026-10-24. Of 129 opened at least 14 days ago, 102 merged, 74 of them without rework. Steps: scout, select, build, verify, gate, ship.">
<title>This account&#x27;s upstream contributions are run by Software Factory. Snapshot 2026-11-26: 107 merged pull requests in 22 projects since 2026-10-24. Of 129 opened at least 14 days ago, 102 merged, 74 of them without rework. Steps: scout, select, build, verify, gate, ship.</title>
<style>.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.row{animation:row 12s linear infinite;opacity:.42}.mark{animation:mark 12s linear infinite;opacity:0}@keyframes row{0%,16.67%{opacity:1}18.67%,100%{opacity:.42}}@keyframes mark{0%,16.67%{opacity:1}18.67%,100%{opacity:0}}.belt{animation:belt .7s linear infinite}@keyframes belt{to{stroke-dashoffset:-16}}.blink{animation:blink 1.2s steps(2,start) infinite}@keyframes blink{to{visibility:hidden}}@media (prefers-reduced-motion: reduce){.row,.mark,.belt,.blink{animation:none}.row{opacity:1}.mark{opacity:1}.moving{display:none}}</style>
<defs><pattern id="g-lightc" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#f3f5f7" stroke-width="1"/></pattern></defs>
