<text class="mono" x="40" y="38" font-size="13" font-weight="700" letter-spacing="1.4" fill="#1f2328">RUN BY SOFTWARE FACTORY</text>
<text class="sans" x="22" y="60" font-size="12" fill="#59636e">Agents open the upstream pull requests, issues and replies.</text>
<text class="mono" x="418" y="38" font-size="10" letter-spacing="1" fill="#59636e" text-anchor="end">2026-11-26</text>
<text class="mono" x="22" y="112" font-size="30" font-weight="700" letter-spacing="-1" fill="#0969da">107</text>
<text class="sans" x="142" y="100" font-size="13" font-weight="600" fill="#1f2328">merged pull requests</text>
<text class="sans" x="142" y="117" font-size="11.5" fill="#59636e">in 22 projects since 2026-10-24</text>
<text class="mono" x="22" y="174" font-size="30" font-weight="700" letter-spacing="-1" fill="#1f2328">79%</text>
<text class="sans" x="142" y="162" font-size="13" font-weight="600" fill="#1f2328">merge rate</text>
<text class="sans" x="142" y="179" font-size="11.5" fill="#59636e">102 of 129 opened 14+ days ago</text>
<text class="mono" x="22" y="236" font-size="30" font-weight="700" letter-spacing="-1" fill="#1f2328">72%</text>
<text class="sans" x="142" y="224" font-size="13" font-weight="600" fill="#1f2328">merged without rework</text>
<text class="sans" x="142" y="241" font-size="11.5" fill="#59636e">74 of 102 merges</text>
<path d="M22 264H418" stroke="#d0d7de" stroke-width="1"/>
<text class="mono mark" x="22" y="288" font-size="12" font-weight="700" fill="#d1510b" style="animation-delay:0s">&gt;</text>
<g class="row" style="animation-delay:0s"><text class="mono" x="36" y="288" font-size="12" font-weight="700" letter-spacing=".6" fill="#1f2328">scout</text><text class="sans" x="92" y="288" font-size="12" fill="#1f2328">reads a problem someone reported</text></g>
<text class="mono mark" x="22" y="310" font-size="12" font-weight="700" fill="#d1510b" style="animation-delay:2s">&gt;</text>
<g class="row" style="animation-delay:2s"><text class="mono" x="36" y="310" font-size="12" font-weight="700" letter-spacing=".6" fill="#1f2328">select</text><text class="sans" x="92" y="310" font-size="12" fill="#1f2328">asks who hits it and whether the project wants a fix</text></g>
<text class="mono mark" x="22" y="332" font-size="12" font-weight="700" fill="#d1510b" style="animation-delay:4s">&gt;</text>
<g class="row" style="animation-delay:4s"><text class="mono" x="36" y="332" font-size="12" font-weight="700" letter-spacing=".6" fill="#1f2328">build</text><text class="sans" x="92" y="332" font-size="12" fill="#1f2328">writes the fix and a test that fails without it</text></g>
<text class="mono mark" x="22" y="354" font-size="12" font-weight="700" fill="#d1510b" style="animation-delay:6s">&gt;</text>
<g class="row" style="animation-delay:6s"><text class="mono" x="36" y="354" font-size="12" font-weight="700" letter-spacing=".6" fill="#1f2328">verify</text><text class="sans" x="92" y="354" font-size="12" fill="#1f2328">a second agent tries to break it</text></g>
<text class="mono mark" x="22" y="376" font-size="12" font-weight="700" fill="#d1510b" style="animation-delay:8s">&gt;</text>
<g class="row" style="animation-delay:8s"><text class="mono" x="36" y="376" font-size="12" font-weight="700" letter-spacing=".6" fill="#1f2328">gate</text><text class="sans" x="92" y="376" font-size="12" fill="#1f2328">reruns the proof, scans, binds the exact commit</text></g>
<text class="mono mark" x="22" y="398" font-size="12" font-weight="700" fill="#d1510b" style="animation-delay:10s">&gt;</text>
<g class="row" style="animation-delay:10s"><text class="mono" x="36" y="398" font-size="12" font-weight="700" letter-spacing=".6" fill="#1f2328">ship</text><text class="sans" x="92" y="398" font-size="12" fill="#1f2328">opens the pull request and says it is automated</text></g>
