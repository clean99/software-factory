<rect x="1" y="1" width="438" height="464" rx="12" fill="url(#g-darkc)"/>
<circle cx="27" cy="33" r="5" fill="#ff8a3d"/>
<text class="mono" x="40" y="38" font-size="13" font-weight="700" letter-spacing="1.4" fill="#e6edf3">RUN BY SOFTWARE FACTORY</text>
<text class="sans" x="22" y="60" font-size="12" fill="#8b949e">Agents open the upstream pull requests, issues and replies.</text>
<text class="mono" x="418" y="38" font-size="10" letter-spacing="1" fill="#8b949e" text-anchor="end">2026-11-26</text>
<text class="mono" x="22" y="112" font-size="30" font-weight="700" letter-spacing="-1" fill="#58a6ff">107</text>
<text class="sans" x="142" y="100" font-size="13" font-weight="600" fill="#e6edf3">merged pull requests</text>
<text class="sans" x="142" y="117" font-size="11.5" fill="#8b949e">in 22 projects since 2026-10-24</text>
<text class="mono" x="22" y="174" font-size="30" font-weight="700" letter-spacing="-1" fill="#e6edf3">79%</text>
<text class="sans" x="142" y="162" font-size="13" font-weight="600" fill="#e6edf3">merge rate</text>
<text class="sans" x="142" y="179" font-size="11.5" fill="#8b949e">102 of 129 opened 14+ days ago</text>
<text class="mono" x="22" y="236" font-size="30" font-weight="700" letter-spacing="-1" fill="#e6edf3">72%</text>
<text class="sans" x="142" y="224" font-size="13" font-weight="600" fill="#e6edf3">merged without rework</text>
<text class="sans" x="142" y="241" font-size="11.5" fill="#8b949e">74 of 102 merges</text>
<path d="M22 264H418" stroke="#30363d" stroke-width="1"/>
<text class="mono mark" x="22" y="288" font-size="12" font-weight="700" fill="#ff8a3d" style="animation-delay:0s">&gt;</text>
<g class="row" style="animation-delay:0s"><text class="mono" x="36" y="288" font-size="12" font-weight="700" letter-spacing=".6" fill="#e6edf3">scout</text><text class="sans" x="92" y="288" font-size="12" fill="#e6edf3">reads a problem someone reported</text></g>
<text class="mono mark" x="22" y="310" font-size="12" font-weight="700" fill="#ff8a3d" style="animation-delay:2s">&gt;</text>
<g class="row" style="animation-delay:2s"><text class="mono" x="36" y="310" font-size="12" font-weight="700" letter-spacing=".6" fill="#e6edf3">select</text><text class="sans" x="92" y="310" font-size="12" fill="#e6edf3">asks who hits it and whether the project wants a fix</text></g>
<text class="mono mark" x="22" y="332" font-size="12" font-weight="700" fill="#ff8a3d" style="animation-delay:4s">&gt;</text>
<g class="row" style="animation-delay:4s"><text class="mono" x="36" y="332" font-size="12" font-weight="700" letter-spacing=".6" fill="#e6edf3">build</text><text class="sans" x="92" y="332" font-size="12" fill="#e6edf3">writes the fix and a test that fails without it</text></g>
<text class="mono mark" x="22" y="354" font-size="12" font-weight="700" fill="#ff8a3d" style="animation-delay:6s">&gt;</text>
<g class="row" style="animation-delay:6s"><text class="mono" x="36" y="354" font-size="12" font-weight="700" letter-spacing=".6" fill="#e6edf3">verify</text><text class="sans" x="92" y="354" font-size="12" fill="#e6edf3">a second agent tries to break it</text></g>
<text class="mono mark" x="22" y="376" font-size="12" font-weight="700" fill="#ff8a3d" style="animation-delay:8s">&gt;</text>
<g class="row" style="animation-delay:8s"><text class="mono" x="36" y="376" font-size="12" font-weight="700" letter-spacing=".6" fill="#e6edf3">gate</text><text class="sans" x="92" y="376" font-size="12" fill="#e6edf3">reruns the proof, scans, binds the exact commit</text></g>
<text class="mono mark" x="22" y="398" font-size="12" font-weight="700" fill="#ff8a3d" style="animation-delay:10s">&gt;</text>
<g class="row" style="animation-delay:10s"><text class="mono" x="36" y="398" font-size="12" font-weight="700" letter-spacing=".6" fill="#e6edf3">ship</text><text class="sans" x="92" y="398" font-size="12" fill="#e6edf3">opens the pull request and says it is automated</text></g>
